main: tech.aurasoftware.candoreco.CandorEco
version: 1.0.0
name: CandorEco
author: Dan
softdepend: [Vault]
description: A comprehensive economy plugin with Vault integration

commands:
  balance:
    description: Check your current balance
    usage: /balance [player]
    permission: candoreco.balance
    aliases: [bal, money]
  
  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
    permission: candoreco.pay
    aliases: [send]
  
  eco:
    description: Economy admin commands
    usage: /eco <subcommand>
    permission: candoreco.admin
    aliases: [economy]
  
  earn:
    description: Earn money with a cooldown
    usage: /earn
    permission: candoreco.earn
    aliases: [daily]

permissions:
  candoreco.balance:
    description: Check your balance
    default: true
  
  candoreco.pay:
    description: Send money to other players
    default: true
  
  candoreco.earn:
    description: Use the earn command
    default: true
  
  candoreco.admin:
    description: Access to economy admin commands
    default: op
    children:
      candoreco.admin.give: true
      candoreco.admin.take: true
      candoreco.admin.set: true
      candoreco.admin.reload: true
      candoreco.admin.freeze: true
  
  candoreco.admin.give:
    description: Give money to players
    default: op
  
  candoreco.admin.take:
    description: Take money from players
    default: op
  
  candoreco.admin.set:
    description: Set player balances
    default: op
  
  candoreco.admin.reload:
    description: Reload plugin configuration
    default: op
  
  candoreco.admin.freeze:
    description: Freeze or unfreeze players
    default: op